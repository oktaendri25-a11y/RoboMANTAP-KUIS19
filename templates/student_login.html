<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Quiz - RoboMANTAP CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 sm:p-8 shadow-[0_0_30px_rgba(16,185,129,0.15)]">
        <div class="text-center mb-6">
            <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold text-[10px] px-3 py-1 rounded-full uppercase tracking-widest">
                Portal Quiz Siswa
            </span>
            <h1 class="text-xl sm:text-2xl font-black text-white mt-3 tracking-tight">RoboMANTAP CBT</h1>
            <p class="text-xs text-slate-400 mt-1">Masukkan data diri dan Kode Kuis dari GuruMANTAP</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/40 text-rose-400 text-xs p-3 rounded-xl mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/verify-token" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nama Lengkap</label>
                <input type="text" name="nama" required placeholder="Masukkan Nama Lengkap Kamu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Kelas</label>
                    <input type="text" name="kelas" required placeholder="12" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">No. Absen</label>
                    <input type="text" name="absen" required placeholder="05" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-">Kode Kuis</label>
                <input type="text" name="token" required placeholder="CONTOH: MTK-12A" class="w-full bg-slate-950 border border-emerald-500/50 rounded-xl px-4 py-3 text-base font-mono font-bold text-emerald-300 uppercase focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-500 active:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-[0_0_15px_rgba(16,185,129,0.4)] mt-2">
                Masuk →
            </button>
        </form>
    </div>
</body>
</html>
